# Telegram bot for Finish The Line: runs scripts/line/bot.mjs (private repo finishtheline/shorts)
# once per event: "telegram" = a message pushed by the Cloudflare Worker (cloudflare/worker.js
# in the private repo), "announce" = a render finished and has previews to send.
# Secrets: SHORTS_TOKEN (fine-grained token, Contents read/write on both repos),
#          TELEGRAM_BOT_TOKEN (from @BotFather).
name: Telegram bot
on:
  repository_dispatch:
    types: [telegram, announce]
  workflow_dispatch:
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: finishtheline/shorts
          token: ${{ secrets.SHORTS_TOKEN }}
          path: shorts
      - uses: actions/checkout@v4
        with:
          path: shorts/site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/line/bot.mjs
        working-directory: shorts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SHORTS_TOKEN: ${{ secrets.SHORTS_TOKEN }}
